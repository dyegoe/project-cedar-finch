# Envoy Gateway resources for local kind. Not part of the Helm chart.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: 30080
                  protocol: TCP
                  targetPort: 10080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nodeport
    namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    # No hostname on the listener: it matches every host, so no /etc/hosts entry is needed.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Local only: accept routes from any namespace. Restrict (Same/Selector) elsewhere.
          from: All
